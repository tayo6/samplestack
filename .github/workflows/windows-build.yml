name: Windows VST3 Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Only the newest build for a ref is useful; this prevents every small
# modular file commit from occupying a separate Windows runner.
concurrency:
  group: samplestack-windows-vst3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-vst3:
    name: Build VST3 (x64, v142)
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure project
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v142

      - name: Build VST3
        run: cmake --build build --config Release --target SampleStack_VST3 --parallel 2

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: SampleStack-VST3-x64
          path: build/SampleStack_artefacts/Release/SampleStack.vst3
          if-no-files-found: error
          retention-days: 14
